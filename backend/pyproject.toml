[project]
name = "thingspan-backend"
version = "0.1.0"
description = "Personal asset tracking backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
